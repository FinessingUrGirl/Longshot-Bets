<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SlipDraw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column, thumb-first. Quiet surfaces, one gold accent, numbers in a set mono. */
:root{
  --bg:#0b0b0b; --bg-2:#111111; --surface:#161616; --surface-2:#1f1f1f; --line:#2a2a2a; --line-soft:#1c1c1c;
  --fg:#ffffff; --muted:#a3a3a3; --faint:#6b6b6b;
  --brand:#9ac434; --brand-hi:#b5dd4f; --brand-lo:#6f9220; --brand-ink:#0b0b0b;
  --win:#7ed957; --orange:#f46c22; --risk:#ff5c5c;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,#161616 0%,var(--bg) 55%) fixed,var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0px) 18px calc(150px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--brand);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;gap:12px;padding-block:22px 14px}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;line-height:1}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-hi),var(--brand-lo));color:var(--brand-ink);font:600 15px/1 var(--serif);box-shadow:0 0 0 1px #ffffff22 inset}
.brand em{font-style:italic;color:var(--brand)}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}

.status{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-bottom:16px}
.status b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-right:7px;vertical-align:2px;box-shadow:0 0 0 3px color-mix(in srgb,var(--win) 20%,transparent)}
.dot.stale{background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.dot.off{background:var(--risk);box-shadow:0 0 0 3px color-mix(in srgb,var(--risk) 20%,transparent)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.tabs button{background:transparent;border:0;border-left:1px solid var(--line);padding:10px 0 9px;color:var(--fg);display:grid;gap:2px;justify-items:center}
.tabs button:first-child{border-left:0}
.tabs button b{font-weight:700;font-size:15px;letter-spacing:.06em}
.tabs button small{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.tabs button[aria-pressed=true] small{color:color-mix(in srgb,var(--brand-ink) 70%,transparent)}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.badge{width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:12px;letter-spacing:0;flex:none}
section.step.pool{padding:0;gap:0}
.poolhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:18px}
.poolhead .grow{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.pooltitle{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.custom{flex:none;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.custom span{font-size:9px}
.frow{display:grid;gap:10px;padding:16px 18px;border-top:1px dashed var(--line)}
.frow:first-of-type{border-top-style:solid}
.flabel{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.fbody{display:grid;gap:10px;min-width:0}
@media (min-width:560px){.frow{grid-template-columns:110px 1fr}}
.pill{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:grid;justify-items:start;align-content:center;gap:0;text-align:left;color:var(--fg)}
.pill b{font-weight:600;font-size:14.5px}
.pill small{font-size:12px;color:var(--muted)}
.pill[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pill[aria-pressed=true] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.mpanel{display:grid;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.ghost:disabled{color:var(--faint);border-color:var(--line-soft)}
.drop{justify-self:start;background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;letter-spacing:.03em;color:var(--fg);display:flex;align-items:center;gap:10px}
.drop b{font-weight:700}
.drop .num{font-size:12px;color:var(--muted)}
.drop i{font-style:normal;font-size:9px;color:var(--muted)}
.tog{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 11px;display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:600;font-size:14.5px}
.tog i{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex:none;position:relative}
.tog em{font-style:normal;font-size:12px;color:var(--muted)}
.tog[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tog[aria-pressed=true] i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:currentColor}
.tog[aria-pressed=true] em{color:color-mix(in srgb,var(--brand-ink) 65%,transparent)}
.segodds{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.segodds button{background:transparent;border:0;border-left:1px solid var(--line);padding:7px 16px;display:grid;justify-items:center;color:var(--fg)}
.segodds button:first-child{border-left:0}
.segodds b{font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.segodds small{font-size:11px;color:var(--muted)}
.segodds button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.segodds button[aria-pressed=true] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}

section.step{background:linear-gradient(180deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--line-soft);border-radius:20px;padding:18px;margin-bottom:12px;display:grid;gap:14px}
.stephead{display:flex;align-items:baseline;gap:10px}
.stephead .n{font-family:var(--mono);color:var(--orange);font-size:11px;letter-spacing:.1em}
.stephead h2{font-size:16px;flex:1}
.link{background:none;border:0;color:var(--brand);font-weight:500;font-size:13.5px;padding:0}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s,background .15s}
.chip[aria-pressed=true]{border-color:color-mix(in srgb,var(--brand) 70%,transparent);color:var(--brand-hi);background:color-mix(in srgb,var(--brand) 9%,transparent)}
.chip.off{opacity:.4}
.chip.off{text-decoration:none} .chip.off>:first-child{text-decoration:line-through}
.chip .cnt{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;margin-left:7px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted)}
.chip[aria-pressed=true] .cnt{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand-hi)}
.chip.pay{display:grid;justify-items:center;gap:1px;padding:7px 12px 6px;border-radius:14px;min-width:76px}
.chip.pay small{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.pay[aria-pressed=true] small{color:var(--brand)}
.chip.pay.no{opacity:.5}
.chip.pay.no[aria-pressed=true]{opacity:1;border-color:color-mix(in srgb,var(--risk) 70%,transparent);background:color-mix(in srgb,var(--risk) 8%,transparent);color:var(--fg)}
.chip.pay.no[aria-pressed=true] small{color:var(--risk)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0;color:var(--fg)}
.switch{appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch:checked{background:var(--brand-lo)} .switch:checked::after{transform:translateX(17px);background:var(--brand-hi)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line-soft);border-radius:12px;padding:3px}
.seg button{background:transparent;border:0;border-radius:9px;padding:9px;font-weight:500;color:var(--faint)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg)}
input.text,textarea.text{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px}
input.text::placeholder{color:var(--faint)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.warn{font-size:13px;color:var(--brand);margin:0 0 12px}
.err{font-size:13px;color:var(--risk);margin:0 0 12px}

.lever{position:relative;overflow:hidden;width:100%;border:0;border-radius:16px;padding:18px;margin-bottom:14px;
  background:linear-gradient(180deg,var(--brand-hi) 0%,var(--brand) 55%,var(--brand-lo) 100%);color:var(--brand-ink);
  font-family:var(--serif);font-size:23px;letter-spacing:.01em;box-shadow:0 1px 0 #fff6 inset,0 10px 30px -10px color-mix(in srgb,var(--brand) 60%,transparent);transition:transform .1s}
.lever::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.lever:active{transform:scale(.985)}
.lever:disabled{opacity:.35}
section.step.build{gap:14px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg2 button{background:transparent;border:0;border-radius:11px;padding:13px 6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bhead .flabel{padding:0;color:var(--fg)}
.bval{font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);font-variant-numeric:tabular-nums}
.sizer{display:flex;align-items:center;gap:14px}
.sizer input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--brand) var(--p),var(--line) var(--p));outline-offset:6px}
.sizer input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brand);border:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 25%,transparent)}
.sizer input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brand);border:0}
.numbox{width:72px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-weight:700;font-size:20px;-moz-appearance:textfield}
.numbox::-webkit-inner-spin-button{-webkit-appearance:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 4px;display:grid;justify-items:center;align-content:center;gap:3px;min-height:62px;color:var(--fg)}
.tile b{font-weight:800;font-size:16px}
.tile small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tile[aria-pressed=true] small{color:color-mix(in srgb,var(--brand-ink) 70%,transparent)}
.tile.no{opacity:.45}
.tile.no[aria-pressed=true]{opacity:1;background:color-mix(in srgb,var(--risk) 12%,var(--bg));border-color:var(--risk);color:var(--fg)}
.tile.no[aria-pressed=true] small{color:var(--risk)}
.moneyin{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--brand);border-radius:12px;padding:0 14px}
.moneyin span{color:var(--brand);font-weight:800;font-size:18px}
.moneyin input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:12px 0;font-weight:700;font-size:18px}
.moneyin.small{width:150px}
.maxrow{display:grid;grid-template-columns:auto repeat(5,1fr);gap:7px;align-items:center}
.maxrow .flabel{padding:0 6px 0 0;color:var(--fg)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:700;font-size:15px;color:var(--fg)}
.box[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.boxes5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.printarea{display:grid;grid-template-columns:1fr auto;align-items:end;gap:14px;margin:6px 0 14px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.5;color:var(--fg)}
.deal b{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-right:6px}
.deal b.bad{color:var(--risk)}
.leverbox{display:grid;justify-items:center;gap:6px;width:112px}
.leverbox .eyebrow{justify-self:start}
.knob{position:relative;width:84px;height:150px;background:none;border:0;padding:0;display:grid;justify-items:center;align-content:start}
.knob .ball{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9ffc4 0%,var(--brand-hi) 14%,var(--brand) 45%,var(--brand-lo) 100%);box-shadow:0 10px 24px -8px #000;position:relative;z-index:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.knob .stick{width:12px;height:92px;margin-top:-8px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#7b8190,#e7eaf0 45%,#9aa0ad);transform-origin:top;transition:transform .25s}
.knob.pulled .ball{animation:yank .55s ease}
.knob.pulled .stick{animation:squash .55s ease}
@keyframes yank{0%{transform:none}40%{transform:translateY(58px)}100%{transform:none}}
@keyframes squash{0%{transform:none}40%{transform:scaleY(.38) translateY(58px)}100%{transform:none}}
.knob.off{opacity:.35}
.printbtn.off{opacity:.35;box-shadow:none}
.blockmsg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--fg);color:var(--bg);padding:16px 18px;text-align:center;font-weight:800;font-size:13px;line-height:1.45;letter-spacing:.08em;text-transform:uppercase;z-index:40;box-shadow:0 18px 40px -12px #000;animation:pop .2s ease}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.printbtn{margin-top:-14px;position:relative;z-index:2;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:12px 10px;width:112px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 20px -10px var(--brand)}
.printbtn:disabled{opacity:.35;box-shadow:none}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}
.lever:disabled::after{display:none}

/* receipt: a black card with gold foil header */
.receipt{background:linear-gradient(160deg,#1a1a1a 0%,#0d0d0d 70%);border:1px solid #2e2e2e;border-radius:22px;padding:20px 18px;margin-bottom:12px;box-shadow:0 30px 60px -30px #000,0 0 0 1px #ffffff08 inset}
.receipt .rh{display:grid;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.receipt .rh .t{font-family:var(--serif);font-size:22px;background:linear-gradient(90deg,var(--brand-hi),var(--brand-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.receipt .rh .m{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.receipt .tip{font-size:12px;color:var(--faint);padding-block:10px 2px}
.leg{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:13px 0;border-bottom:1px solid var(--line-soft);color:inherit}
.leg .who{flex:1;min-width:0}
.leg .who b{display:block;font-weight:600;font-size:14.5px}
.leg .who small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.leg .px{font-family:var(--mono);font-weight:600;font-size:14px;text-align:right;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:58px}
.tag{display:inline-block;font:600 9.5px/1.6 var(--sans);letter-spacing:.1em;text-transform:uppercase;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.tag.keep{border-color:var(--brand-lo);color:var(--brand-hi)} .tag.thin{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 50%,transparent)}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rtop h2{font-size:26px;font-weight:700}
.rmeta{display:grid;justify-items:end;gap:2px;text-align:right}
.rmeta b{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.rmeta span{font-size:13px;color:var(--muted)}
.rmeta em{font-style:normal;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.lrow{border-bottom:1px dashed var(--line)}
.lrow.open{background:color-mix(in srgb,var(--brand) 5%,var(--surface));border-radius:12px;border-bottom-color:transparent;margin:4px -8px;padding:0 8px}
.lhead{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;width:100%;background:none;border:0;text-align:left;padding:14px 0;color:inherit}
.lhead .no{color:var(--brand);font-weight:700;font-size:13px;padding-top:2px}
.lhead .who{min-width:0}
.lhead .who b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.lrow.open .lhead .who b{color:var(--brand)}
.lhead .who small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.pxcol{display:grid;justify-items:end;gap:6px}
.pxcol i{font-style:normal;font-size:9px;color:var(--brand)}
.pxp{background:color-mix(in srgb,var(--brand) 14%,var(--bg));color:var(--brand);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.lbody{display:grid;gap:12px;padding:0 0 16px 40px}
.lacts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.act svg{width:16px;height:16px}
.act.dim{color:var(--muted)}
.act[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.altchip{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--fg)}

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="blockmsg" class="blockmsg" role="alert" hidden></div>

<script>
"use strict";
/* ---------- config ---------- */
const PUBLIC_RELAY = "https://longshotbets.erikguerrero1998.workers.dev";
const SPORTS = [
  { k: "football_nfl", l: "NFL", days: 8 },
  { k: "basketball_nba", l: "NBA", days: 3 },
  { k: "hockey_nhl", l: "NHL", days: 3 },
  { k: "baseball_mlb", l: "MLB", days: 3 },
];
const BOOKS = [
  { k: "draftkings", l: "DraftKings", u: "https://sportsbook.draftkings.com" },
  { k: "fanduel", l: "FanDuel", u: "https://sportsbook.fanduel.com" },
  { k: "betmgm", l: "BetMGM", u: "https://sports.betmgm.com" },
  { k: "fanatics", l: "Fanatics", u: "https://sportsbook.fanatics.com" },
  { k: "hardrock", l: "Hard Rock", u: "https://www.hardrock.bet" },
  { k: "betrivers", l: "BetRivers", u: "https://www.betrivers.com" },
];
const FAIR_ONLY = ["pinnacle", "bovada"];
const BOOK_KEYS = BOOKS.map(b => b.k);
const GAME_LINE_KEYS = /^(h2h|spreads|totals|alternate_|team_|.*_winner$|btts|double_chance|draw_no_bet|correct_score)/;
const MAX_PER_GAME = 10;
const MAX_EVENTS = 16;

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ll_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ll_" + k, JSON.stringify(v)); return true; } catch { return false; } },
};

/* ---------- odds math ---------- */
const dec = a => a > 0 ? 1 + a / 100 : 1 + 100 / -a;
const imp = a => 1 / dec(a);
const fmtA = a => a == null ? "—" : (a > 0 ? "+" + a : String(a));
const money = v => v >= 1000 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + v.toFixed(2);
const pct = p => (p * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const median = xs => { const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const prettyMarket = k => {
  k = k.replace(/_?\d+plus_?/, "_");
  if (/anytime_td|anytime_touchdown/.test(k)) return "Anytime TD";
  const map = { pass_rush_yds: "Pass + Rush Yards", rush_reception_yds: "Rush + Rec Yards", rush_rec_yds: "Rush + Rec Yards", reception_longest: "Longest Reception", rush_longest: "Longest Rush", pass_longest_completion: "Longest Completion", longest_completion: "Longest Completion", pass_interceptions: "Interceptions Thrown", interceptions: "Interceptions Thrown", rush_attempts: "Rush Attempts", pass_yds: "Passing Yards", rush_yds: "Rushing Yards", reception_yds: "Receiving Yards", rec_yds: "Receiving Yards", receiving_yds: "Receiving Yards", pass_tds: "Passing TDs", pass_attempts: "Pass Attempts", pass_completions: "Pass Completions", hits_runs_rbis: "H+R+RBI", points_rebounds_assists: "Pts+Reb+Ast", shots_on_goal: "Shots on Goal" };
  let s = k.replace(/^_+|_+$/g, "").replace(/^(player|batter|pitcher|goalie)_/, "");
  if (map[s]) return map[s];
  return s.split("_").map(w => /^(tds|rbi|sog)$/.test(w) ? w.toUpperCase() : w === "yds" ? "Yds" : w[0].toUpperCase() + w.slice(1)).join(" ");
};
const bookName = k => (BOOKS.find(b => b.k === k) || { l: k }).l;

/* ---------- state ---------- */
const S = {
  age: store.get("age", false),
  relay: store.get("relay", "") || PUBLIC_RELAY,
  every: store.get("every", 3),
  tab: "machine",
  sport: store.get("sport", "football_nfl"),
  book: store.get("book", "draftkings"),
  f: { days: new Set(), games: new Set(), off: new Set(), alt: true, unders: true, top: false, odds: "any", open: true, yes: true, hit: store.get("hit", true), pickG: false, pickM: false },
  byLegs: true, legN: 4, target: 1000, maxLegs: null, stake: 10,
  ticket: [], kept: new Set(), removed: new Set(), drawn: {},
  saved: store.get("saved", []),
  data: {}, loading: {}, error: "",
  sheet: null, notice: "",
  logs: {}, logBusy: {}, logProg: null, grading: false, shared: null,
  ticketNo: store.get("ticketNo", 0), openLeg: null, openStats: false,
};
for (const sp of SPORTS) S.logs[sp.k] = store.get("logs_" + sp.k, {});

for (const sp of SPORTS) { const d = store.get("data_" + sp.k, null); if (d) S.data[sp.k] = d; }

/* ---------- API ---------- */
async function api(path, params = {}) {
  const base = S.relay.replace(/\/+$/, "");
  const u = new URL(base + "/v1" + path);
  for (const [k, v] of Object.entries(params)) if (v != null && v !== "") u.searchParams.set(k, v);
  let r;
  try { r = await fetch(u.toString()); }
  catch { throw new Error("Couldn't reach the odds service. Check your connection, then tap Refresh now."); }
  if (r.status === 401 || r.status === 403) throw new Error("The odds service isn't set up yet. Try again later.");
  if (r.status === 429) throw new Error("Lots of people are printing tickets right now. Try again in a minute.");
  if (r.status === 503) throw new Error("Live lines are paused for now. Try again later.");
  if (!r.ok) throw new Error("The odds service returned an error (" + r.status + "). Try again in a minute.");
  return r.json();
}

async function pool(items, n, fn) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const idx = i++; try { out[idx] = await fn(items[idx]); } catch (e) { out[idx] = { error: e }; } }
  }));
  return out;
}

async function loadSport(sk) {
  if (S.loading[sk]) return;
  S.loading[sk] = true; S.error = ""; render();
  try {
    const sp = SPORTS.find(s => s.k === sk);
    const now = Date.now();
    const evs = (await api(`/sports/${sk}/events`))
      .filter(e => e.away_team && !e.is_outright)
      .filter(e => { const t = Date.parse(e.commence_time); return t > now && t < now + sp.days * 864e5; })
      .sort((a, b) => Date.parse(a.commence_time) - Date.parse(b.commence_time))
      .slice(0, MAX_EVENTS);
    if (!evs.length) { saveData(sk, { t: now, games: [], legs: [], links: {} }); return; }

    // discover which prop markets exist (one cheap call; retry on up to 3 games)
    let keys = [];
    for (const e of evs.slice(0, 3)) {
      const mk = await api(`/sports/${sk}/events/${e.id}/markets`);
      keys = (mk || []).map(m => m.key).filter(k => !GAME_LINE_KEYS.test(k));
      if (keys.length) break;
    }
    if (!keys.length) { saveData(sk, { t: now, games: evs.map(gameOf), legs: [], links: {} }); return; }

    const params = { markets: keys.join(","), bookmakers: [...BOOK_KEYS, ...FAIR_ONLY].join(","), includeLinks: "true" };
    const want = new Set(evs.map(e => String(e.id)));
    let events = [];
    try {
      const bulk = await api(`/sports/${sk}/odds`, params);
      events = (bulk || []).filter(e => want.has(String(e.id)));
    } catch (e) { if (/key|limit/.test(e.message)) throw e; }
    let built = build(events);
    if (!built.legs.length) {
      const res = await pool(evs, 4, e => api(`/sports/${sk}/events/${e.id}/odds`, params));
      const firstErr = res.find(r => r && r.error);
      events = res.filter(r => r && !r.error);
      if (!events.length && firstErr) throw firstErr.error;
      built = build(events);
    }
    // market-implied projections (paid plan); one call per game, skipped quietly if unavailable
    const proj = {};
    const pres = await pool(evs, 4, e => api(`/sports/${sk}/events/${e.id}/projections`));
    pres.forEach((r, i) => {
      if (!r || r.error || r.redacted || !Array.isArray(r.projections)) return;
      const gid = String(evs[i].id);
      for (const x of r.projections) {
        if (x.projected_value == null) continue;
        if (x.player_id) proj[`${gid}|${x.market_key}|${x.player_id}`] = x.projected_value;
        proj[`${gid}|${x.market_key}|${normName(x.player)}`] = x.projected_value;
      }
    });
    saveData(sk, { t: now, games: evs.map(gameOf), legs: built.legs, links: built.links, proj });
  } catch (e) {
    S.error = e.message;
  } finally {
    S.loading[sk] = false; render();
    if (sk === S.sport) ensureLogs();
  }
}
const gameOf = e => ({ id: String(e.id), label: `${e.away_team} @ ${e.home_team}`, t: e.commence_time });
function saveData(sk, d) {
  S.data[sk] = d;
  if (!store.set("data_" + sk, d)) { /* storage full: keep in memory only */ }
  if (sk === S.sport) { S.ticket = []; S.kept.clear(); }
}

const normName = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s*\([^)]*\)\s*$/, "").replace(/[^a-z0-9 ]/g, "").replace(/\s+(jr|sr|ii|iii)$/, "").trim();
const cleanName = s => String(s).replace(/\s*\([^)]*\)\s*$/, "");

/* Read one outcome as either a two-way over/under line or a one-sided "Yes" prop
   (anytime TD, 2+ hits, "to record a hit"). Returns null for anything else. */
function parseOutcome(mkey, o) {
  if (!o || o.price == null) return null;
  if ((o.name === "Over" || o.name === "Under") && o.point != null && o.description)
    return { kind: "ou", player: cleanName(o.description), pk: o.player_id || normName(o.description), line: o.point, side: o.name[0] };
  if (o.point != null) return null;
  let player = null, n = null, side = "Y";
  const mN = /^(\d+)\+/.exec(o.name || "");
  if (mN && o.description) { player = o.description; n = +mN[1]; }
  else if ((o.name === "Yes" || o.name === "No") && o.description) { player = o.description; side = o.name === "Yes" ? "Y" : "N"; }
  else if (o.name && !/^(Over|Under|Yes|No)$/.test(o.name) && (!o.description || normName(o.description) === normName(o.name))) player = o.name;
  if (!player) return null;
  if (n == null) { const k = /(\d+)plus/.exec(mkey); n = k ? +k[1] : 1; }
  return { kind: "yes", player: cleanName(player), pk: o.player_id || normName(player), line: n, side };
}
const legKey = (m, pk, kind, line, side) => `${m}|${pk}|${kind === "yes" ? "Y" + line : line}|${side}`;

/* Turn raw odds into priced legs. Over/under: remove each book's cut from its pair and
   use Pinnacle's fair price (or the median across books). Yes props: devig where a book
   posts Yes and No; otherwise estimate from the books' Yes prices (marked Est.). */
const YES_HOLD = 1.12;
function build(events) {
  const groups = new Map(), links = {};
  for (const ev of events) {
    if (!ev || !ev.bookmakers) continue;
    const gid = String(ev.id);
    for (const b of ev.bookmakers) {
      if (b.link) (links[gid] ||= {})[b.key] = b.link;
      for (const m of b.markets || []) {
        if (m.period) continue;
        for (const o of m.outcomes || []) {
          const x = parseOutcome(m.key, o); if (!x) continue;
          const key = `${gid}|${m.key}|${x.pk}|${x.kind === "yes" ? "Y" + x.line : x.line}`;
          let g = groups.get(key);
          if (!g) { g = { gid, m: m.key, p: x.player, pk: x.pk, pt: x.line, kind: x.kind, alt: x.kind === "ou", books: {} }; groups.set(key, g); }
          if (x.kind === "ou" && (o.line_type || m.line_type) === "main") g.alt = false;
          (g.books[b.key] ||= {})[x.side] = o.price;
        }
      }
    }
  }
  const legs = [];
  for (const [key, g] of groups) {
    if (g.kind === "ou") {
      const fairs = {};
      for (const [bk, pr] of Object.entries(g.books)) if (pr.O != null && pr.U != null) { const a = imp(pr.O), c = imp(pr.U); fairs[bk] = a / (a + c); }
      const fk = Object.keys(fairs); if (!fk.length) continue;
      const pOver = fairs.pinnacle != null ? fairs.pinnacle : median(fk.map(k => fairs[k]));
      const thin = fk.length < 2 && fairs.pinnacle == null;
      for (const side of ["O", "U"]) {
        const pr = {};
        for (const bk of BOOK_KEYS) { const v = g.books[bk] && g.books[bk][side]; if (v != null && v > -2000 && v < 5000) pr[bk] = v; }
        if (!Object.keys(pr).length) continue;
        legs.push({ id: key + "|" + side, g: g.gid, m: g.m, p: g.p, pk: g.pk, pt: g.pt, s: side, kind: "ou", alt: g.alt,
          f: side === "O" ? pOver : 1 - pOver, thin, n: fk.length, pr });
      }
    } else {
      const pairs = [], ones = [];
      for (const [bk, pr] of Object.entries(g.books)) {
        if (pr.Y == null) continue;
        if (pr.N != null) { const a = imp(pr.Y), c = imp(pr.N); pairs.push(a / (a + c)); } else ones.push(imp(pr.Y));
      }
      if (!pairs.length && !ones.length) continue;
      const est = !pairs.length;
      const f = Math.min(0.97, est ? median(ones) / YES_HOLD : median(pairs));
      const pr = {};
      for (const bk of BOOK_KEYS) { const v = g.books[bk] && g.books[bk].Y; if (v != null && v > -2000 && v < 10000) pr[bk] = v; }
      if (!Object.keys(pr).length) continue;
      legs.push({ id: key + "|Y", g: g.gid, m: g.m, p: g.p, pk: g.pk, pt: g.pt, s: "Y", kind: "yes", alt: g.pt >= 2,
        f, est, thin: false, n: pairs.length + ones.length, pr });
    }
  }
  return { legs, links };
}

/* ---------- pricing ---------- */
const priceAt = (l, book) => {
  if (book) return l.pr[book] != null ? { b: book, a: l.pr[book] } : null;
  let best = null; for (const [b, a] of Object.entries(l.pr)) if (!best || dec(a) > dec(best.a)) best = { b, a };
  return best;
};
const edge = (l, book) => { const p = priceAt(l, book); return p ? l.f * dec(p.a) - 1 : -1; };
function priceTicket(legs, stake, book) {

function migrate(t) {

function ticketState(t) {

}
function settledReturn(t) {

}
async function gradeAll() {
  if (S.grading) return;
  const now = Date.now(), jobs = new Map();
  for (const t of S.saved) {
    migrate(t);
    for (const l of t.legs) {
      if (l.r) continue;
      const started = l.gt ? Date.parse(l.gt) + 3 * 36e5 < now : t.at + 6 * 36e5 < now;
      if (!started) continue;
      const k = t.sk + "|" + l.g; if (!jobs.has(k)) jobs.set(k, { sk: t.sk, g: l.g, m: new Set() }); jobs.get(k).m.add(l.m);
    }
  }
  if (!jobs.size) return;
  S.grading = true; render();
  const results = {};
  await pool([...jobs.values()], 3, async j => {
    try {
      const r = await api(`/sports/${j.sk}/events/${j.g}/results`, { markets: [...j.m].join(",") });
      const map = {};
      for (const b of r.bookmakers || []) for (const m of b.markets || []) {
        if (m.period) continue;
        for (const o of m.outcomes || []) {
          if (!o.resolution) continue;
          const x = parseOutcome(m.key, o); if (!x) continue;
          for (const pk of [x.pk, normName(x.player)]) { const k = legKey(m.key, pk, x.kind, x.line, x.side); if (!map[k]) map[k] = o.resolution; }
        }

    const r = R.map[legKey(l.m, l.pk, l.kind, l.pt, l.s)] || R.map[legKey(l.m, normName(l.p), l.kind, l.pt, l.s)];

}

  </section>`;

  const printSec = `<div class="printarea">
    <div class="deal" id="deal"><b class="${deal.cls}">${deal.tag}</b> ${deal.text}</div>
    <div class="leverbox">
      <div class="eyebrow"><span class="badge">3</span>Print</div>

  return sharedHTML() + tabs + statusHTML() + poolSec + buildSec + printSec +
    (S.notice ? `<p class="warn">${esc(S.notice)}</p>` : "") +
    (S.ticket.length ? receiptHTML(gm) : "");
}

/* ---------- player card ---------- */
function statCols(sk, m) {
  if (sk === "football_nfl") return /pass|completion|interception/.test(m) && !/pass_rush/.test(m)
    ? [["CMP", "passing_completions"], ["ATT", "passing_attempts"], ["YDS", "passing_yards"], ["TD", "passing_tds"], ["INT", "interceptions"], ["RUSH", "rushing_yards"]]
    : [["REC", "receptions"], ["YDS", "receiving_yards"], ["TD", "_td"], ["CAR", "rushing_attempts"], ["RUSH", "rushing_yards"]];
  if (sk === "basketball_nba") return [["MIN", "minutes"], ["PTS", "points"], ["REB", "rebounds"], ["AST", "assists"], ["3PM", "threes"], ["STL", "steals"], ["BLK", "blocks"]];
  if (sk === "hockey_nhl") return /saves/.test(m) ? [["SV", "saves"]] : [["G", "goals"], ["PTS", "points_nhl"], ["SOG", "shots_on_goal"], ["BLK", "blocked_shots"], ["PPP", "power_play_points"]];
  return /pitcher/.test(m) ? [["K", "strikeouts"], ["OUTS", "outs"], ["ER", "earned_runs"], ["H", "hits_allowed"]]
    : [["H", "hits"], ["TB", "total_bases"], ["HR", "home_runs"], ["RBI", "rbis"], ["R", "runs"], ["BB", "walks"], ["SB", "stolen_bases"]];
}
const statVal = (s, k) => k === "_td" ? ((s.receiving_tds ?? 0) + (s.rushing_tds ?? 0)) || (s.anytime_td ?? (s.receiving_tds == null && s.rushing_tds == null ? null : 0)) : s[k];
const fmtN = v => v == null || Number.isNaN(v) ? "–" : Number.isInteger(v) ? String(v) : v.toFixed(1);
function cardHTML(l) {
  const sk = S.sport, g = gameMap()[l.g], lg = S.logs[sk][l.pk], games = lg ? lg.games : null;
  let st = statFor(sk, l.m); const key = st === "anytime_td" ? "_td" : st;
  const tm = teamOf(l), [away, home] = g ? g.label.split(" @ ") : ["", ""];
  const opp = tm ? (nick(tm) === nick(home) ? away : home) : "";
  const thr = l.kind === "yes" ? l.pt - 0.5 : l.pt, hit = v => l.s === "U" ? v < thr : v > thr;
  const what = l.kind === "yes" ? (key === "_td" ? "Scored" : `Hit ${l.pt}+`) : `${l.s === "O" ? "Over" : "Under"} ${l.pt}`;
  const arrow = up => up == null ? "" : up ? '<i class="up">▲</i>' : '<i class="dn">▼</i>';
  const withVal = (games || []).filter(x => statVal(x.s, key) != null);
  const rows = [];
  if (key && games) {
    const l5 = withVal.slice(0, 5), n = l5.filter(x => hit(statVal(x.s, key))).length;
    rows.push(["Last 5", l5.length ? `${arrow(n / l5.length >= l.f)}${what} in ${n} of ${l5.length}` : "No games logged yet"]);
    if (opp) {
      const h2 = withVal.filter(x => x.o && nick(x.o) === nick(opp)), n2 = h2.filter(x => hit(statVal(x.s, key))).length;
      rows.push([`vs ${nick(opp)}`, h2.length ? `${what} in ${n2} of ${h2.length} game${h2.length === 1 ? "" : "s"}` : "No recent games on record"]);
    }
  }
  const pj = projOf(l), p = priceAt(l, S.book);
  if (pj != null && l.kind === "ou") rows.push(["Market", `${arrow(l.s === "O" ? pj > l.pt : pj < l.pt)}Projects ${pj} vs a line of ${l.pt}`]);
  if (p) rows.push(["Fair chance", `${arrow(l.f >= imp(p.a))}${pct(l.f)}${l.est ? " (est.)" : ""} vs ${pct(imp(p.a))} the price implies`]);
  const cols = statCols(sk, l.m);
  if (key && !cols.some(c => c[1] === key)) cols.push([prettyMarket(l.m).split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 4), key]);
  const hl = k => k === key ? " hl" : "";
  let perGame = "", log = "";
  if (games && games.length) {
    const bySeason = {};
    for (const x of games) (bySeason[seasonYear(sk, x.t)] ||= []).push(x);
    perGame = `<div class="tscroll"><table class="stbl"><thead><tr><th>Season</th><th>GP</th>${cols.map(([c, k]) => `<th class="${hl(k)}">${c}</th>`).join("")}</tr></thead><tbody>
      ${Object.keys(bySeason).sort((a, b) => b - a).map(y => { const gs = bySeason[y];
        return `<tr><td>${seasonLabel(sk, +y)}</td><td>${gs.length}</td>${cols.map(([, k]) => { const vs = gs.map(x => statVal(x.s, k)).filter(v => v != null); return `<td class="${hl(k)}">${vs.length ? fmtN(vs.reduce((a, b) => a + b, 0) / vs.length) : "–"}</td>`; }).join("")}</tr>`; }).join("")}
      </tbody></table></div>`;
    const cur = seasonYear(sk, Date.now());
    log = `<div class="tscroll"><table class="stbl"><thead><tr><th>Game</th><th>Opp</th>${key ? '<th class="hl yes">' + (l.kind === "yes" ? "Yes" : l.s === "O" ? "Over" : "Under") + "</th>" : ""}${cols.map(([c, k]) => `<th class="${hl(k)}">${c}</th>`).join("")}</tr></thead><tbody>
      ${games.slice(0, 12).map(x => { const y = seasonYear(sk, x.t), pre = y !== cur ? `'${String(y).slice(2)} ` : "";
        const lab = sk === "football_nfl" ? `${pre}Wk ${nflWeek(x.t)}` : new Date(x.t).toLocaleDateString("en-US", { month: "numeric", day: "numeric" }) + (y !== cur ? ` '${String(y).slice(2)}` : "");
        const v = key ? statVal(x.s, key) : null;
        return `<tr><td>${lab}</td><td>${esc(nick(x.o))}</td>${key ? `<td class="hl yes">${v == null ? "–" : hit(v) ? `<span class="ok">✓</span> ${fmtN(v)}` : `<span class="no">✗</span> ${fmtN(v)}`}</td>` : ""}${cols.map(([, k]) => `<td class="${hl(k)}">${fmtN(statVal(x.s, k))}</td>`).join("")}</tr>`; }).join("")}
      </tbody></table></div>`;
  }
  return `<div class="pchead"><div><h3>${esc(l.p)}</h3><p class="hint">${tm ? esc(nick(tm)) + " · " : ""}${opp ? "vs " + esc(nick(opp)) + " · " : ""}${esc(g ? g.label : "")}</p></div><button class="xbtn" data-act="close" aria-label="Close">${ICO.x}</button></div>
    <div class="pleg"><b>${esc(legSide(l))}</b><span class="pxp num">${fmtA(p && p.a)}</span></div>
    ${rows.length ? `<div class="facts">${rows.map(([k, v]) => `<div class="fk">${esc(k)}</div><div class="fv">${v}</div>`).join("")}</div>
    <p class="hint"><i class="up">▲</i> helps this leg · <i class="dn">▼</i> works against it</p>` : ""}
    ${!games ? `<p class="hint">${S.cardLoading ? "Loading game log…" : "No game log available for this player yet."}</p>` : ""}
    ${perGame ? `<div class="flabel">Per game</div>${perGame}` : ""}
    ${log ? `<div class="flabel">Game log</div>${log}` : ""}
    <div class="flabel">Price by book</div>
    <div class="kv">${Object.entries(l.pr).sort((a, b) => dec(b[1]) - dec(a[1])).map(([b, a]) => `<span>${esc(bookName(b))}</span><b class="num">${fmtA(a)}</b>`).join("")}</div>`;
}

function savedHTML() {
  if (!S.saved.length) return `<h2 class="page-title">Your tickets</h2><div class="empty">Save a ticket from the receipt and it stays here on this phone. Finished games are graded automatically.</div>`;
  S.saved.forEach(migrate);
  let w = 0, lo = 0, op = 0, staked = 0, back = 0;
  for (const t of S.saved) { const s = ticketState(t); if (s === "won") { w++; staked += t.stake; back += settledReturn(t); } else if (s === "lost") { lo++; staked += t.stake; } else op++; }
  const net = back - staked;
  return `<h2 class="page-title">Your tickets</h2>
    <div class="card"><div class="kv">
      <span>Record</span><b class="num">${w}–${lo}${op ? ` · ${op} open` : ""}</b>
      <span>Net if played</span><b class="num" style="color:${net >= 0 ? "var(--win)" : "var(--risk)"}">${net >= 0 ? "+" : "−"}${money(Math.abs(net))}</b></div>
      <div class="row"><span class="hint grow">${S.grading ? "Checking results…" : "Legs are graded against the box score after each game."}</span>${!S.grading ? `<button class="link" data-act="grade">Check results</button>` : ""}</div></div>` +
    S.saved.map((t, i) => {

        ${t.legs.map(l => { const r = l.r && RES[l.r]; return `<div class="row" style="font-size:13.5px"><span class="grow">${esc(l.title)}</span><span class="num" style="color:${r ? r.c : "var(--muted)"}">${r ? r.t : fmtA(l.a)}</span></div>`; }).join("")}

        <div class="actions"><button class="btn" data-act="sshare:${i}">Share…</button><button class="btn" data-act="sdel:${i}">Delete</button></div></div>`;
    }).join("");

function learnHTML() {
  const qa = [
    ["Is this betting advice?", "No. The machine draws legs from live prices for entertainment and shows how much the book keeps. A well-priced leg can still lose."],
    ["How is a ticket priced?", "Each leg's American odds become a chance to hit. The fair chance comes from the over and under prices with the book's cut removed, using Pinnacle when it has the line and the middle of the other books when it doesn't. Fair chances multiply into the ticket's real odds. The gap between the fair return and the book's return is the book's cut."],
    ["What does Thin mean?", "Only one book had both sides of that line, so its fair price leans on a single book."],
    ["What does Est. mean?", "Scorer and other Yes props usually have no No side to compare, so the fair price is estimated from the books' Yes prices with a typical cut taken out."],
    ["What is Proj?", "The stat value the betting market implies for that player, taken from where the over and under are priced evenly across books. It's a read of the market, not a forecast."],
    ["Only lines he's hit", "With this on, alt lines and 2+ type props are drawn only if the player has reached that number at least once this season, checked against his game log. Players with no games logged yet stay in."],
    ["How are saved tickets graded?", "After each game, every leg is checked against the official box score: won, lost, push or void. The record and net assume the ticket was played at the saved prices."],
    ["How are legs drawn?", "Legs priced better than fair come up more often, but repeats are dialed down so you don't see the same few legs. One player per ticket, and at most 10 legs from one game."],
    ["Keep, Swap, Remove, Add?", "Keep holds a leg for your next ticket. Swap redraws one leg. Remove drops it and keeps that player out until you tap Release. Add top-rated leg adds the best-priced leg left in the sport, ignoring your filters."],
    ["Why pick a sportsbook?", "A parlay has to go on at one book, so the machine only draws legs that book offers and prices the ticket there. Compare all shows each leg's best price across books, which you can't bet as one ticket."],
    ["Where do the lines come from?", "PropLine, refreshed automatically every few hours while the app is open, or whenever you tap Refresh now. Each refresh uses a handful of your daily requests."],
    ["Limits", "Same-game legs move together and this doesn't account for that. Lines move after they load. Most parlays lose money over time after the book's cut. Need help? 1-800-GAMBLER."],
  ];
  return `<h2 class="page-title">How it works</h2>` + qa.map(([q, a]) => `<div class="card"><details><summary>${q}</summary><p>${a}</p></details></div>`).join("");
}

    body = `<h3>Copy this ticket</h3><p class="hint">Long-press the text and choose Copy.</p><textarea id="copy-area" class="text" rows="9" readonly>${esc(sh.text)}</textarea>`;
  } else if (sh.type === "settings") {
    body = `<h3>Settings</h3>
      <div class="label">Refresh lines every</div>
      <div class="chips">${[1, 3, 6].map(h => chip(h + " hr", S.every === h, "every:" + h)).join("")}</div>
      <p class="hint">Lines also refresh whenever you tap Refresh now.</p>
      <details><summary class="hint">Advanced</summary>
        <label class="label" for="relay-input" style="display:block;margin-top:10px">Odds service link</label>
        <input id="relay-input" class="text" type="url" autocomplete="off" value="${esc(S.relay)}" style="margin-top:6px">
        <button class="btn" data-act="saverelay" style="margin-top:8px">Save link</button>
      </details>`;
  }
  return `<div class="scrim" data-act="close"><div class="sheet" data-stop>${body}<button class="btn" data-act="close">Close</button></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (stop && el.classList.contains("scrim")) return;
  if (el.tagName === "INPUT") return;
  const [act, ...rest] = el.dataset.act.split(":"); const arg = rest.join(":");
  const f = S.f;
  switch (act) {
    case "age": S.age = true; store.set("age", true); render(); maybeRefresh(); return;
    case "tab": S.tab = arg; window.scrollTo(0, 0); if (arg === "saved") setTimeout(gradeAll, 0); break;
    case "settings": S.sheet = { type: "settings" }; break;
    case "close": S.sheet = null; break;
    case "refresh": loadSport(S.sport); return;
    case "sport": S.sport = arg; store.set("sport", arg); S.ticket = []; S.kept.clear(); S.removed.clear(); S.notice = ""; S.error = "";
      f.days.clear(); f.games.clear(); f.off.clear(); f.pickG = f.pickM = false; render(); maybeRefresh(); ensureLogs(); return;
    case "pool": f.open = !f.open; break;
    case "allgames": f.days.clear(); f.games.clear(); break;
    case "day": { const on = f.days.has(arg) && !f.games.size; f.games.clear(); f.days.clear(); if (!on) f.days.add(arg); break; }
    case "game": f.days.clear(); f.games.has(arg) ? f.games.delete(arg) : f.games.add(arg); break;
    case "pickg": f.pickG = !f.pickG; break;
    case "pickm": f.pickM = !f.pickM; break;
    case "unders": f.unders = !f.unders; break;
    case "alt": f.alt = !f.alt; break;
    case "yes": f.yes = !f.yes; break;
    case "top": f.top = !f.top; break;
    case "hit": f.hit = !f.hit; store.set("hit", f.hit); render(); ensureLogs(); return;
    case "mkt": f.off.has(arg) ? f.off.delete(arg) : f.off.add(arg); break;
    case "mktall": if (arg === "on") f.off.clear(); else for (const l of D().legs) f.off.add(l.m); break;
    case "odds": f.odds = arg; break;
    case "mode": S.byLegs = arg === "legs"; break;
    case "legn": S.legN = +arg; break;
    case "target": S.target = +arg; S.customOpen = false; break;
    case "customwin": S.customOpen = true; render(); document.getElementById("custom-target")?.focus(); return;
    case "maxl": S.maxLegs = arg === "any" ? null : +arg; break;
    case "stake": S.stake = +arg; break;
    case "book": S.book = arg === "all" ? null : arg; store.set("book", S.book); S.ticket = []; S.kept.clear(); break;
    case "pull": {
      const pl = poolLegs();
      if (!dealState(pl).ok) { blockMsg(cantPrintMsg(pl)); return; }
      const k = document.getElementById("knob"); if (k) { k.classList.remove("pulled"); void k.offsetWidth; k.classList.add("pulled"); }
      setTimeout(pull, 260); return;
    }
    case "leg": S.openLeg = S.openLeg === +arg ? null : +arg; S.openStats = false; break;
    case "toreceipt": document.getElementById("receipt")?.scrollIntoView({ behavior: "smooth", block: "start" }); return;
    case "openstats": S.openStats = !S.openStats; break;
    case "keep": { const l = S.ticket[+arg]; S.kept.has(l.id) ? S.kept.delete(l.id) : S.kept.add(l.id); S.sheet = null; break; }
    case "swap": swap(+arg); return;
    case "remove": removeLeg(+arg); return;
    case "alts": S.sheet = { type: "alts", i: +arg }; break;
    case "card": {
      S.sheet = { type: "card", i: +arg }; const l = S.ticket[+arg], sk = S.sport;
      const lg = S.logs[sk][l.pk];
      if (!lg || Date.now() - lg.at > LOG_TTL) {
        S.cardLoading = true;
        fetchLog(sk, l).catch(() => {}).finally(() => { S.cardLoading = false; persistLogs(sk); if (S.sheet && S.sheet.type === "card") render(); });
      }
      break;
    }
    case "use": { const [i, ...id] = rest; const nl = D().legs.find(l => l.id === id.join(":")); if (nl) S.ticket = S.ticket.map((x, j) => j === +i ? nl : x); S.sheet = null; S.openStats = false; break; }
    case "release": S.removed.delete(arg); break;
    case "addtop": addTop(); return;
    case "save":
      S.saved = [curSnap(), ...S.saved].slice(0, 100);
      store.set("saved", S.saved); toast("Ticket saved"); break;
    case "share": S.sheet = { type: "share", src: curSnap() }; break;
    case "img": { const t = S.sheet.src; S.sheet = null; render(); shareImage(t, arg === "story"); return; }
    case "link": { const t = S.sheet.src; S.sheet = null; render(); copyText(shareLink(t)); return; }
    case "stext": { const t = S.sheet.src; S.sheet = null; render(); shareText(snapText(t)); return; }
    case "ctext": { const t = S.sheet.src; S.sheet = null; render(); copyText(snapText(t)); return; }
    case "unshare": S.shared = null; history.replaceState(null, "", location.pathname); break;
    case "grade": gradeAll(); return;
    case "openbook": {
      const t = snapText(curSnap());
      const link = (D().links[S.ticket[0].g] || {})[S.book];
      const url = link || BOOKS.find(b => b.k === S.book).u;
      navigator.clipboard?.writeText(t).then(() => toast("Legs copied"), () => {});
      window.open(url, "_blank", "noopener"); return;
    }
    case "sshare": S.sheet = { type: "share", src: migrate(S.saved[+arg]) }; break;
    case "sdel": S.saved.splice(+arg, 1); store.set("saved", S.saved); break;
    case "every": S.every = +arg; store.set("every", S.every); break;
    case "saverelay": {
      let rl = document.getElementById("relay-input").value.trim();
      if (rl && !/^https?:\/\//i.test(rl)) rl = "https://" + rl;
      S.relay = rl || PUBLIC_RELAY; store.set("relay", rl ? S.relay : ""); S.sheet = null; S.error = ""; render(); loadSport(S.sport); return;
    }

  }
  render();
});
document.addEventListener("change", e => {
  const a = e.target.dataset.act;
});
document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.input; if ((k === "stake" && !S.byLegs) || k === "target") render(); if (k === "legn") e.target.value = S.legN; });
document.addEventListener("input", e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === "legn") {
    const n = Math.max(2, Math.min(LEG_MAX, parseInt(e.target.value) || 0)); if (!parseInt(e.target.value)) return;
    S.legN = n;
    const r = document.getElementById("legn-range"), b = document.getElementById("legn-num"), lb = document.getElementById("legn-label");
    if (r && e.target !== r) r.value = n; if (b && e.target !== b) b.value = n;
    if (r) r.style.setProperty("--p", ((n - 2) / (LEG_MAX - 2) * 100) + "%");
    if (lb) lb.textContent = n + " legs";
    refreshLever(); return;
  }
  const v = parseFloat(e.target.value.replace(/[^0-9.]/g, ""));
  if (!(v > 0)) return;
  if (k === "stake") { S.stake = v; refreshLever(); document.querySelectorAll(`[data-act^="stake:"]`).forEach(c => c.setAttribute("aria-pressed", "false")); return; }
  if (k === "target") { S.target = v; const el = document.getElementById("custom-odds"); if (el) { const pl = poolLegs(); el.textContent = customOddsText(payoutOdds(payoutStats(pl), v, maxReturn(pl)), v); } refreshLever(); } else S.stake = v;
  document.querySelectorAll(`[data-act^="${k}:"]`).forEach(c => c.setAttribute("aria-pressed", "false"));
});

try { const q = new URLSearchParams(location.search).get("t"); if (q) S.shared = decodeTicket(q); } catch {}
render();
maybeRefresh();
ensureLogs();
</script>
</body>
</html>
